name: CI CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write
  packages: write
  deployment: write

jobs:
  secret-scan:
    name: Secret Scan
    uses: ./.github/workflows/secret-scan.yml
    secrets: inherit

  linting:
    name: Code Linting
    needs: [secret-scan]
    uses: ./.github/workflows/linting.yml

  dependency-sca:
    name: Dependency SCA
    needs: [linting]
    uses: ./.github/workflows/dependency_sca.yml
