name: Code Linting

on:
  push:

jobs:
  python-linting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: ./services/product-service

      - name: Install and Run Pylint
        run: |
          pip install pylint
          pylint services/product-service/app --disable=C0111,C0103,W0613
        working-directory: ./services/product-service

  javascript-linting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

    strategy:
      fail-fast: false
      matrix:
        folder:
          - frontend
          - gateway
          - services/payment-service

    defaults:
      run:
        working-directory: ${{ matrix.folder }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.folder }}/package-lock.json

      - name: Install Dependencies
        run: npm i

      - name: Run ESLint
        run: npm run lint
        
  go-linting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: services/auth-service/go.sum

      - name: Install Dependencies
        working-directory: services/auth-service
        run: go mod download

      - name: Run Go Vet
        working-directory: services/auth-service
        run: go vet ./...
    
        