name: Security Scan (Secrets & SAST)

on:
  workflow_call:
  push:
    branches:
      - main
  pull_request:

jobs:
  # 1. Global Secret Scan (Language Agnostic)
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # 2. Language-Specific SAST: Python
  sast-python:
    name: SAST Scan (Python / Bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit on Product Service
        run: bandit -r ./services/product-service -ll
        continue-on-error: true

  # 3. Language-Specific SAST: Go
  sast-go:
    name: SAST Scan (Go / Gosec)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Gosec on Auth Service
        uses: securego/gosec@master
        with:
          args: ./services/auth-service/...
        continue-on-error: true

  # 4. Language-Specific SAST: Node.js
  sast-node:
    name: SAST Scan (Node.js / njsscan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run njsscan on JS Services
        uses: ajinabraham/njsscan-action@master
        with:
          args: './frontend ./gateway ./services/payment-service'
        continue-on-error: true
